<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haru IA</title>
  <link rel="icon" href="Haru.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="janela">

    <!-- Identidade do Haru -->
    <aside class="painel-rosto">
      <img class="rosto" id="rosto" src="Haru.avif" alt="Haru, um Yorkshire Terrier"
           width="180" height="180">
      <div class="identidade">
        <h1>Haru IA</h1>
        <p id="texto-status">Pronta para criptografar</p>
      </div>
    </aside>

    <!-- Lado do chat -->
    <section class="chat">
      <div class="mensagens" id="mensagens" aria-live="polite"></div>

      <div class="acoes-chat" aria-label="Ações do Haru">
        <button type="button" class="acao-chat" id="acao-criptografar">
          Criptografar texto
        </button>
        <button type="button" class="acao-chat" id="acao-descriptografar">
          Descriptografar texto
        </button>
        <button type="button" class="acao-chat acao-arquivo" id="acao-criptografar-arquivo">
          Criptografar imagem/PDF
        </button>
        <button type="button" class="acao-chat acao-arquivo" id="acao-descriptografar-arquivo">
          Abrir arquivo protegido
        </button>
      </div>
      <p class="aviso-arquivos">Imagens e PDFs de até 50 MB. Os arquivos são protegidos neste navegador.</p>

      <input class="seletor-arquivo" type="file" id="arquivo-para-criptografar"
             accept="image/*,.pdf,application/pdf" aria-label="Escolher imagem ou PDF">
      <input class="seletor-arquivo" type="file" id="arquivo-para-descriptografar"
             accept=".haru,application/octet-stream" aria-label="Escolher arquivo Haru protegido">

      <form class="entrada" id="formulario">
        <input
          type="text"
          id="campo"
          placeholder="Escolha uma ação acima para começar"
          aria-label="Mensagem"
          autocomplete="off"
          enterkeyhint="send">
        <button type="submit">Enviar</button>
      </form>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
