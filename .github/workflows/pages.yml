name: Publicar Haru no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Interface
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
